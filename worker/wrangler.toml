name = "tt-turn-credentials"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Stored logs (off by default; invocation logs record request metadata, so
# this is an opt-in). Uncomment, redeploy, then view at dash.cloudflare.com ->
# Workers & Pages -> tt-turn-credentials -> Observability. Needs wrangler >= 3.78.6.
# [observability]
# enabled = true
# head_sampling_rate = 1

[vars]
# ALLOWED_ORIGINS is intentionally not set here. bin/setup.sh asks for it and
# bin/deploy.sh injects it with `wrangler deploy --var`. (Deploying without it
# leaves /ice rejecting every browser origin.)
# Credential lifetime. Must exceed the longest session you expect.
TTL_SECONDS = "86400"
# Stop minting TURN credentials (STUN only) once month-to-date egress reaches
# this many GB. Free tier is 1,000 GB; leave headroom for analytics lag.
# Set to "0" to disable. Needs the CF_ACCOUNT_ID and ANALYTICS_TOKEN secrets.
USAGE_LIMIT_GB = "600"
